<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Jin-chan's Flashcards — Batch</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
  <!--link rel="stylesheet" href="../../style.css" /-->
  <link rel="stylesheet" href="./flashcards.css" />
  <style>
    .mode-controls {
      text-align: center;
      margin: 8px 0 12px;
      opacity: 0.82;
    }
    .mode-controls .mode-btn {
      margin: 0 2px;
      padding: 3px 8px;
      font-size: 0.78rem;
      font-weight: 400;
      line-height: 1.2;
      border: 1px solid rgba(127, 127, 127, 0.35);
      border-radius: 999px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      opacity: 0.62;
      box-shadow: none;
    }
    .mode-controls .mode-btn.active {
      font-weight: 400;
      outline: none;
      opacity: 0.95;
      background: rgba(127, 127, 127, 0.12);
      border-color: rgba(127, 127, 127, 0.5);
    }
    .flashcard.definition-first .front .word {
      font-size: 1.25rem;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .back-answer {
      text-align: center;
      margin-bottom: 14px;
    }
    .back-answer .back-word {
      margin-bottom: 4px;
    }
    .back-answer .back-ipa,
    .back-answer .back-pos {
      margin: 3px 0;
    }

    .local-edit-actions {
      text-align: center;
      margin: 8px 0;
    }
    .local-edit-actions button {
      margin: 2px;
    }
    .local-edit-modal[hidden] { display: none !important; }
    .local-edit-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,0.42);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      box-sizing: border-box;
    }
    .local-edit-panel {
      width: min(760px, 96vw);
      max-height: 90vh;
      overflow: auto;
      background: #fffdf7;
      color: #2f2a21;
      border-radius: 14px;
      padding: 20px;
      box-sizing: border-box;
      box-shadow: 0 14px 44px rgba(0,0,0,0.22);
      text-align: left;
    }
    .local-edit-panel h2 { margin-top: 0; text-align: center; }
    .local-edit-panel label { display: block; margin: 10px 0; }
    .local-edit-panel input,
    .local-edit-panel textarea {
      width: 100%;
      box-sizing: border-box;
      margin-top: 4px;
      padding: 8px 9px;
      font: inherit;
    }
    .local-edit-two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .local-edit-form-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
    }
    .local-edit-help {
      text-align: center;
      opacity: .72;
      font-size: .9rem;
      margin: 0 0 12px;
    }
    .practice-inline {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex-wrap: wrap;
      margin: 6px 0;
    }
    .practice-inline > button,
    .record-practice button {
      margin: 0;
    }
    .record-practice {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex-wrap: wrap;
      margin: 0;
    }
    .record-practice .btn-record {
      padding-left: 9px;
      padding-right: 9px;
    }
    .record-practice .record-status {
      text-align: center;
      font-size: .74rem;
      opacity: .68;
      margin-left: 2px;
    }
    .record-practice .record-status:empty { display: none; }
    .tts-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tts-buttons > button,
    .tts-buttons .record-practice {
      vertical-align: middle;
    }

    /* Stage 5/6 Garden UI pass: controls only; study content typography stays intact. */
    .flashcard button,
    .mode-controls .mode-btn,
    .local-edit-actions button {
      appearance: none;
      -webkit-appearance: none;
      font-family: "EB Garamond", Georgia, serif;
      font-size: 1.03rem;
      font-weight: 400;
      line-height: 1.15;
      color: #315f43;
      background: rgba(255, 253, 247, .72);
      border: 1px solid rgba(72, 104, 68, .30);
      border-radius: 9px;
      padding: 7px 14px;
      min-height: 40px;
      box-shadow: none;
      cursor: pointer;
      transition: background-color .16s ease, border-color .16s ease, color .16s ease, transform .12s ease;
    }
    .flashcard button:hover,
    .mode-controls .mode-btn:hover,
    .local-edit-actions button:hover {
      background: rgba(84, 112, 70, .09);
      border-color: rgba(63, 94, 58, .52);
      color: #234d35;
    }
    .flashcard button:active,
    .mode-controls .mode-btn:active,
    .local-edit-actions button:active { transform: translateY(1px); }
    .flashcard button:focus-visible,
    .mode-controls .mode-btn:focus-visible,
    .local-edit-actions button:focus-visible {
      outline: 2px solid rgba(66, 102, 65, .28);
      outline-offset: 2px;
    }
    .practice-inline { gap: 7px; }
    .practice-inline .btn-speak { min-width: 44px; padding-inline: 11px; }
    .practice-inline .btn-flip { min-width: 66px; }
    .record-practice { gap: 6px; }
    .record-practice .btn-record,
    .record-practice .btn-record-stop,
    .record-practice .btn-record-mine,
    .record-practice .btn-record-save,
    .record-practice .btn-record-retake,
    .record-practice .btn-record-clear,
    .record-practice .btn-record-saved,
    .record-practice .btn-record-delete { min-height: 38px; }
    .nav-buttons { margin-top: 12px; }
    .nav-buttons .btn-prev,
    .nav-buttons .btn-next { min-width: 88px; }
    .tts-buttons { gap: 7px; }
    .tts-buttons .btn-voice { min-width: 42px; padding-inline: 10px; }
    .local-edit-actions { margin: 10px 0 7px; }
    .local-edit-actions button { font-size: .92rem; }
    .external-link {
      display: flex;
      width: fit-content;
      margin: 10px auto 14px;
      padding: 4px 8px;
      color: #3f6b49;
      text-decoration: none;
      font-family: "EB Garamond", Georgia, serif;
      font-size: 1rem;
      border-bottom: 1px solid transparent;
      transition: color .16s ease, border-color .16s ease;
    }
    .external-link:hover { color: #274d34; border-bottom-color: rgba(63,107,73,.45); }
    .external-link { align-items: center; gap: .38em; }
    .external-link .search-icon { width: .92em; height: .92em; stroke-width: 1.55; }
    .mode-controls .mode-btn {
      font-family: "EB Garamond", Georgia, serif;
      font-size: .95rem;
      color: #556254;
      border-color: rgba(72,104,68,.22);
      background: transparent;
      opacity: .72;
      min-height: 30px;
      padding: 4px 10px;
    }
    .mode-controls .mode-btn.active {
      color: #315f43;
      background: rgba(84,112,70,.08);
      border-color: rgba(63,94,58,.40);
      opacity: 1;
    }

    body.local-edit-open { overflow: hidden; }
    @media (max-width: 620px) {
      .local-edit-two-col { grid-template-columns: 1fr; gap: 0; }
      .local-edit-panel { padding: 15px; }
    }

    /* Garden Card UI v5: typography-led controls, no OS emoji chrome. */
    .flashcard button { letter-spacing: .01em; }
    .practice-inline .btn-speak,
    .practice-inline .btn-flip,
    .record-practice .btn-record { min-width: 78px; }
    .nav-buttons { display:flex; justify-content:center; gap:18px; }
    .nav-buttons .btn-prev, .nav-buttons .btn-next { min-width: 112px; }
    .tts-buttons > button, .tts-buttons .record-practice button { font-size: 1rem; }
    .btn-studied, .btn-review { color:#315f43; }
    .btn-shuffle, .btn-edit-local, .btn-revert-local { color:#5e654f; }
    .external-link { font-family:"EB Garamond", Georgia, serif; font-size:1rem; letter-spacing:.01em; }
    @media (max-width: 560px) {
      .flashcard button, .mode-controls .mode-btn, .local-edit-actions button { min-height: 42px; padding: 7px 11px; }
      .practice-inline { gap:6px; }
      .practice-inline .btn-speak, .practice-inline .btn-flip, .record-practice .btn-record { min-width: 70px; }
      .nav-buttons { gap:10px; }
      .nav-buttons .btn-prev, .nav-buttons .btn-next { min-width: 104px; }
    }

    /* Garden Card UI v6: semantic monochrome controls. */
    .ui-icon {
      width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.65;
      stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto;
    }
    .btn-record, .btn-shuffle, .btn-speak, .btn-tts-def, .btn-tts-ex, .btn-tts-all { display: inline-flex; align-items: center; justify-content: center; gap: .42em; }
    .play-icon { stroke: none; fill: currentColor; width: 1.12em; height: 1.12em; transform: translateY(.045em); }
    .play-icon .play-fill { fill: currentColor; stroke: none; }
    .record-play-icon { width: 1.02em; height: 1.02em; transform: translateY(.04em); }
    .btn-speak, .btn-tts-def, .btn-tts-ex, .btn-tts-all { white-space: nowrap; }
    .voice-control { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .voice-detail {
      font-family: "EB Garamond", Georgia, serif; font-size: .82rem; color: #6d735f;
      max-width: 150px; line-height: 1.05; text-align: left;
    }
    #deck-nav-links a {
      font-family: "EB Garamond", Georgia, serif; color: #3f6b49; text-decoration: none;
      font-size: 1.06rem; transition: color .16s ease, border-color .16s ease, background-color .16s ease;
    }
    #deck-nav-links .deck-step-link:hover { color: #274d34; text-decoration: underline; text-underline-offset: 3px; }
    #deck-nav-links .deck-home-link {
      display: inline-block; padding: 7px 15px; border: 1px solid rgba(72,104,68,.24);
      border-radius: 999px; background: rgba(255,253,247,.60);
    }
    #deck-nav-links .deck-home-link:hover {
      color: #274d34; background: rgba(84,112,70,.08); border-color: rgba(63,94,58,.42);
    }
    @media (max-width: 560px) {
      .voice-control { gap: 4px; }
      .voice-detail { max-width: 110px; font-size: .76rem; }
      #deck-nav-links { column-gap: 10px !important; grid-template-columns: 1fr auto 1fr !important; padding: 0 8px; }
      #deck-nav-links a { font-size: .98rem; }
      #deck-nav-links .deck-home-link { padding: 7px 11px; }
    }
  </style>
</head>
<body>
<header class="study-shell-header">
    <a class="study-home-pill" href="../../index.html"><span class="home-nav-mark" aria-hidden="true">‹</span><span>Back to Home</span></a>
    <div class="study-brand" aria-label="WLP — The Secret Wordlist Garden">
      <div class="study-brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M11.7 20.5c.1-5.7 1.2-10 4.5-13.6"></path><path d="M15.6 7.8c1.7-2.7 4.3-3.3 6.1-2.9-.2 2.6-1.8 5.4-5.9 5.7"></path><path d="M12.2 13.7c-2.5-3.4-5.9-3.8-8.1-3 .4 3.3 2.6 5.9 7.3 5.8"></path></svg>
      </div>
      <div>
        <div class="study-brand-title">WLP</div>
        <div class="study-brand-subtitle">The Secret Wordlist Garden</div>
      </div>
    </div>
    <div class="study-header-spacer" aria-hidden="true"></div>
  </header>
  <!-- カード1枚分のテンプレ（HTMLで見える形で置くのが一番わかりやすい） -->
  <template id="card-tpl">
    <div class="flashcard">
      <div class="front">
        <h2 class="word"></h2>
        <p class="ipa"></p>
        <p class="pos"></p>
        <div class="practice-inline">
          <button class="btn-speak"><svg class="ui-icon play-icon" viewBox="0 0 24 24" aria-hidden="true"><path class="play-fill" d="M4.5 2.8 21 12 4.5 21.2Z"></path></svg><span>Listen</span></button>
          <button class="btn-flip">Show Answer</button>
          <div class="record-practice" data-record-kind="word">
            <button type="button" class="btn-record" title="Record your pronunciation"><svg class="ui-icon mic-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M6.5 11.5a5.5 5.5 0 0 0 11 0M12 17v4M9 21h6"></path></svg><span>Record</span></button>
            <button type="button" class="btn-record-stop" hidden>■ Stop</button>
            <button type="button" class="btn-record-mine" hidden><svg class="ui-icon play-icon record-play-icon" viewBox="0 0 24 24" aria-hidden="true"><path class="play-fill" d="M4.5 2.8 21 12 4.5 21.2Z"></path></svg><span>My Take</span></button>
            <button type="button" class="btn-record-save" hidden>♡ Save</button>
            <button type="button" class="btn-record-retake" hidden title="Record a new take">↻ Retake</button>
            <button type="button" class="btn-record-clear" hidden title="Clear the current unsaved take">× Clear</button>
            <button type="button" class="btn-record-saved" hidden><svg class="ui-icon play-icon record-play-icon" viewBox="0 0 24 24" aria-hidden="true"><path class="play-fill" d="M4.5 2.8 21 12 4.5 21.2Z"></path></svg><span>Saved Take</span></button>
            <button type="button" class="btn-record-delete" hidden title="Delete saved take">Delete</button>
            <span class="record-status"></span>
          </div>
        </div>
        <div class="nav-buttons">
          <button class="btn-prev" aria-label="Previous card" title="Previous card">‹</button>
          <button class="btn-next" aria-label="Next card" title="Next card">›</button>
        </div>
		<span class="card-tag"></span>
      </div>
      <div class="back">
        <div class="back-answer" hidden>
          <h2 class="back-word"></h2>
          <p class="back-ipa"></p>
          <p class="back-pos"></p>
        </div>
        <pre class="def study-back-first"></pre>
        <pre class="ex"></pre>
        <pre class="syn"></pre>
        <pre class="note"></pre>
        <a class="external-link" target="_blank"><svg class="ui-icon search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.75"></circle><path d="M14.75 14.75 20 20"></path></svg><span>External Reference</span></a>
        <div class="spacer"></div>
		<!-- TTS Buttons -->
<div class="tts-buttons" style="text-align:center; margin: 8px 0;">
  <button class="btn-tts-def"><svg class="ui-icon play-icon" viewBox="0 0 24 24" aria-hidden="true"><path class="play-fill" d="M4.5 2.8 21 12 4.5 21.2Z"></path></svg><span>Definition</span></button>
  <button class="btn-tts-ex"><svg class="ui-icon play-icon" viewBox="0 0 24 24" aria-hidden="true"><path class="play-fill" d="M4.5 2.8 21 12 4.5 21.2Z"></path></svg><span>Example(s)</span></button>
  <span class="record-practice" data-record-kind="example">
    <button type="button" class="btn-record" title="Record the example sentence"><svg class="ui-icon mic-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M6.5 11.5a5.5 5.5 0 0 0 11 0M12 17v4M9 21h6"></path></svg><span>Record</span></button>
    <button type="button" class="btn-record-stop" hidden>■ Stop</button>
    <button type="button" class="btn-record-mine" hidden><svg class="ui-icon play-icon record-play-icon" viewBox="0 0 24 24" aria-hidden="true"><path class="play-fill" d="M4.5 2.8 21 12 4.5 21.2Z"></path></svg><span>My Take</span></button>
    <button type="button" class="btn-record-save" hidden>♡ Save</button>
    <button type="button" class="btn-record-retake" hidden title="Record a new take">↻ Retake</button>
    <button type="button" class="btn-record-clear" hidden title="Clear the current unsaved take">× Clear</button>
    <button type="button" class="btn-record-saved" hidden><svg class="ui-icon play-icon record-play-icon" viewBox="0 0 24 24" aria-hidden="true"><path class="play-fill" d="M4.5 2.8 21 12 4.5 21.2Z"></path></svg><span>Saved Take</span></button>
    <button type="button" class="btn-record-delete" hidden title="Delete saved take">Delete</button>
    <span class="record-status"></span>
  </span>
  <button class="btn-tts-all"><svg class="ui-icon play-icon" viewBox="0 0 24 24" aria-hidden="true"><path class="play-fill" d="M4.5 2.8 21 12 4.5 21.2Z"></path></svg><span>Read All</span></button>
   <!-- ★ 追加：声を切り替える1ボタン -->
  <span class="voice-control"><button class="btn-voice" title="Switch Voice">‹ Voice ›</button><span class="voice-detail" aria-live="polite"></span></span>
</div>
        <div class="local-edit-actions">
          <button type="button" class="btn-edit-local">Edit Card</button>
          <button type="button" class="btn-revert-local" hidden>Revert</button>
        </div>
        <button class="btn-flip-back">Flip Back</button>
        <button class="btn-studied">Studied</button>
        <button class="btn-review">Review</button>
        <button class="btn-shuffle"><svg class="ui-icon shuffle-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3c4.5 0 5.5 10 10 10h3"></path><path d="m17 14 3 3-3 3"></path><path d="M4 17h3c1.7 0 2.9-1.4 4-3.2"></path><path d="M14 8.2C15 7.5 16 7 17 7h3"></path><path d="m17 4 3 3-3 3"></path></svg><span>Shuffle</span></button>
        <div class="nav-buttons">
          <button class="btn-prev" aria-label="Previous card" title="Previous card">‹</button>
          <button class="btn-next" aria-label="Next card" title="Next card">›</button>
        </div>
        <span class="card-tag"></span>
      </div>
    </div>
  </template>

  <div class="mode-controls" aria-label="Flashcard display mode">
    <button class="mode-btn" data-mode="word" type="button">Word First</button>
    <button class="mode-btn" data-mode="definition" type="button">Definition First</button>
  </div>

  <!-- 差し込み先 -->
  <div id="cards"></div>

  <div style="text-align:center; margin-top:2em; line-height:2;">
 <div id="review-back-link" style="display:none;">
  ↩ <a href="../../index.html#review">Back to Review Decks</a>
</div>

  <div id="progress-back-link" style="display:none;">
  ↩ <a href="../../index.html#progress">Back to Progress</a>
</div>

  <div id="drafts-back-link" style="display:none;">
  ↩ <a href="../../index.html#drafts">Back to Drafts</a>
</div>

  <div
  id="deck-nav-links"
  style="
    display:grid;
    grid-template-columns:150px 150px 150px;
    justify-content:center;
    align-items:center;
    column-gap:48px;
    margin:1.5em auto 0;
    line-height:1.4;
  "
>
  <div style="text-align:right;">
    <a
      id="prev-deck-link"
      class="deck-step-link"
      href="#"
      style="display:none;"
    >
      <span class="deck-nav-mark" aria-hidden="true">‹</span><span>Previous Deck</span>
    </a>
  </div>

  <div style="text-align:center;">
    <a class="deck-home-link deck-home-duplicate" href="../../index.html">Back to Home</a>
  </div>

  <div style="text-align:left;">
    <a
      id="next-deck-link"
      class="deck-step-link"
      href="#"
      style="display:none;"
    >
      <span>Next Deck</span><span class="deck-nav-mark" aria-hidden="true">›</span>
    </a>
  </div>
</div>


  <div id="local-edit-modal" class="local-edit-modal" hidden>
    <div class="local-edit-panel" role="dialog" aria-modal="true" aria-labelledby="local-edit-title">
      <h2 id="local-edit-title">Edit Local Override</h2>
      <p class="local-edit-help">
        Saves only in this browser. Batch #, Guidance #, and permanent WordID are never changed.
      </p>
      <form id="local-edit-form">
        <label>Word<input name="Word" type="text" required></label>
        <div class="local-edit-two-col">
          <label>IPA<input name="IPA" type="text"></label>
          <label>Part of Speech<input name="Part of Speech" type="text" list="wlp-pos-options" autocomplete="off" placeholder="Choose or type…"></label>
        </div>
        <label>Definition<textarea name="Definition" rows="4"></textarea></label>
        <label>Synonym(s)<textarea name="Synonym(s)" rows="3"></textarea></label>
        <label>Example Sentence<textarea name="Example Sentence" rows="4"></textarea></label>
        <label>Note(s)<textarea name="Note(s)" rows="4"></textarea></label>
        <div class="local-edit-two-col">
          <label>Category<input name="Category" type="text"></label>
          <label>Source<input name="Source" type="text"></label>
        </div>
        <div class="local-edit-form-actions">
          <button type="submit">Save Local Override</button>
          <button type="button" id="local-edit-cancel">Cancel</button>
        </div>
      </form>
      <datalist id="wlp-pos-options">
        <option value="noun"></option>
        <option value="verb"></option>
        <option value="adjective"></option>
        <option value="adverb"></option>
        <option value="pronoun"></option>
        <option value="preposition"></option>
        <option value="conjunction"></option>
        <option value="interjection"></option>
        <option value="determiner"></option>
        <option value="proper noun"></option>
        <option value="noun phrase"></option>
        <option value="verb phrase"></option>
        <option value="adjective phrase"></option>
        <option value="adverbial phrase"></option>
        <option value="phrasal verb"></option>
        <option value="idiom"></option>
        <option value="phrase"></option>
        <option value="expression"></option>
        <option value="collocation"></option>
        <option value="verb construction"></option>
        <option value="verb pattern"></option>
        <option value="slang"></option>
      </datalist>
    </div>
  </div>

  <script type="module" src="./app.js?v=20260913-garden-v621"></script>
</body>
</html>
